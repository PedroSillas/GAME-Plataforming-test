<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Peak Hike - 16-Bit Precision Platformer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #05050a;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            padding: 10px;
            background: #141021;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 4px #2a203d, 0 0 0 8px #453563;
        }

        canvas {
            background-color: #05050a;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #000;
        }

        #ui-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            font-size: 9px;
            color: #f4f4f4;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }

        .ui-badge {
            background: #191228;
            padding: 6px 10px;
            border: 2px solid #453563;
            box-shadow: 2px 2px 0px #000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-hint {
            margin-top: 14px;
            font-size: 8px;
            color: #7b6e9c;
            text-align: center;
            line-height: 1.6;
        }

        .controls-hint span {
            color: #ff2a6d;
        }
    </style>
</head>

let mouseY = 0;

    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;

});

    keys[e.code] = true;

    // Detecção da sequência "w a s d b u g" na tela de título
    if (gameState === STATE_MENU) {
        const key = e.key.toLowerCase();
        if (key === DEBUG_SEQUENCE[debugSeqIdx]) {
            debugSeqIdx++;

        }
    }

    if (e.code === 'KeyR' && gameState === STATE_PLAYING) {
        isRespawning = false;
        resetPlayer();

});

        speedY: -Math.random() * 0.5 - 0.2,
        alpha: Math.random() * 0.6 + 0.2

}

    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4.5 * speedMultiplier,

function startGame(isDebug = false) {
    deaths = 0;
    strawberries = 0;
    currentLevelIdx = 0;
    gameCompleted = false;
    finalTimeMs = null;
    isRespawning = false;
    debugMode = isDebug;
    startTime = Date.now();
    levels.forEach(lvl => lvl.strawberries.forEach(s => s.active = true));
    resetPlayer();
    gameState = STATE_PLAYING;
    document.getElementById('ui-bar').style.display = 'flex';
    const debugBadge = document.getElementById('debug-info');
    if (debugBadge) {
        debugBadge.style.display = debugMode ? 'flex' : 'none';
    }
}

function resetPlayer() {
    const lvl = levels[currentLevelIdx];
    player.x = lvl.spawn.x;
    player.y = lvl.spawn.y;
    player.vx = 0; player.vy = 0;
    player.canDash = true;
    player.isDashing = false;
    player.grounded = false;
    player.coyoteTime = 0;
    player.jumpBuffer = 0;
    player.scaleX = 1; player.scaleY = 1;
    player.aimDir = { x: 0, y: 0 };
    player.walkTimer = 0;
    
    for(let i=0; i<player.hair.length; i++) {
        player.hair[i] = { x: player.x, y: player.y };
    }
}

// --- ENTRADAS DE MOVIMENTO E MIRA DE DASH ---
function isLeftPressed() {
    return controlScheme === 'SETAS' ? keys['ArrowLeft'] : keys['KeyA'];
}

function isRightPressed() {
    return controlScheme === 'SETAS' ? keys['ArrowRight'] : keys['KeyD'];
}

function isUpPressed() {
    return controlScheme === 'SETAS' ? keys['ArrowUp'] : keys['KeyW'];
}

function isDownPressed() {
    return controlScheme === 'SETAS' ? keys['ArrowDown'] : keys['KeyS'];
}

function isJumpPressed() {
    return keys['Space'] || (controlScheme === 'SETAS' ? keys['ArrowUp'] : keys['KeyW']);
}

function isDashPressed() {
    return keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyJ'];
}

function getDashAimDirection() {
    let dx = 0, dy = 0;

    if (dashAimEnabled) {
        if (controlScheme === 'SETAS') {
            // Se a movimentação for com as setas, WASD direciona as setinhas e o dash
            if (keys['KeyA']) dx -= 1;
            if (keys['KeyD']) dx += 1;
            if (keys['KeyW']) dy -= 1;
            if (keys['KeyS']) dy += 1;
        } else {
            // Se a movimentação for WASD, as Setas direcionam as setinhas e o dash
            if (keys['ArrowLeft']) dx -= 1;
            if (keys['ArrowRight']) dx += 1;
            if (keys['ArrowUp']) dy -= 1;
            if (keys['ArrowDown']) dy += 1;
        }
    }

    if (dx === 0 && dy === 0) {
        if (isLeftPressed()) dx -= 1;
        if (isRightPressed()) dx += 1;
        if (isUpPressed()) dy -= 1;
        if (isDownPressed()) dy += 1;
    }

    return { x: dx, y: dy };
}

// --- ATUALIZAÇÃO DO JOGO ---
function update() {
    if (gameState !== STATE_PLAYING) return;
    if (gameCompleted) return;

    if (isRespawning) {
        cameraX = Math.max(0, Math.min(player.x - canvas.width / 2, WORLD_WIDTH - canvas.width));

        ambientParticles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;
            if(p.y < 0) p.y = WORLD_HEIGHT;
            if(p.x < 0) p.x = WORLD_WIDTH;
            if(p.x > WORLD_WIDTH) p.x = 0;
        });

        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            if (p.life <= 0) particles.splice(index, 1);
        });

        if (Date.now() >= respawnEndTime) {
            isRespawning = false;
            resetPlayer();
            spawnParticles(player.x + player.w/2, player.y + player.h/2, 15, "#ffffff", 1.2);
        }
        return;
    }

    const lvl = levels[currentLevelIdx];

    // Câmera
    cameraX = Math.max(0, Math.min(player.x - canvas.width / 2, WORLD_WIDTH - canvas.width));

    // Partículas de Fundo
    ambientParticles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if(p.y < 0) p.y = WORLD_HEIGHT;
        if(p.x < 0) p.x = WORLD_WIDTH;
        if(p.x > WORLD_WIDTH) p.x = 0;
    });

    // Animação de Deformação
    player.scaleX += (1 - player.scaleX) * 0.2;
    player.scaleY += (1 - player.scaleY) * 0.2;

    // Tolerância no chão / Pulo
    if (player.grounded) player.coyoteTime = 6;
    else if (player.coyoteTime > 0) player.coyoteTime--;

    if (player.jumpBuffer > 0) player.jumpBuffer--;

    // Atualiza direção para a Seta de Mira de Dash
    player.aimDir = getDashAimDirection();

    // Execução do Dash
    if (isDashPressed() && player.canDash && !player.isDashing) {
        player.canDash = false;
        player.isDashing = true;
        player.dashTimer = 8;

        let { dx, dy } = { dx: player.aimDir.x, dy: player.aimDir.y };

        if (dx === 0 && dy === 0) dx = player.facing;

        const dist = Math.hypot(dx, dy);
        player.dashDir = { x: (dx / dist) * 12, y: (dy / dist) * 12 };
        
        player.scaleX = 1.4; player.scaleY = 0.6;
        spawnParticles(player.x + player.w/2, player.y + player.h/2, 10, "#ff2a6d", 1.5);
    }

    if (player.isDashing) {
        player.vx = player.dashDir.x;
        player.vy = player.dashDir.y;
        player.dashTimer--;
        
        player.trail.push({x: player.x, y: player.y, alpha: 0.7});

        if (player.dashTimer <= 0) {
            player.isDashing = false;
            player.vx *= 0.55;
            player.vy *= 0.55;
        }
    } else {
        // Movimento Horizontal
        if (isRightPressed()) {
            if (player.vx < player.maxSpeed) player.vx += player.accel;
            player.facing = 1;
        } else if (isLeftPressed()) {
            if (player.vx > -player.maxSpeed) player.vx -= player.accel;
            player.facing = -1;
        } else {
            player.vx *= FRICTION;
        }

        if (player.grounded && Math.abs(player.vx) > 0.3) {
            player.walkTimer += Math.abs(player.vx) * 0.35;
        } else if (player.grounded) {
            player.walkTimer = 0;
        }

        player.vy += GRAVITY;

        // Wall Slide
        if (player.onWall !== 0 && player.vy > 0) {
            player.vy = Math.min(player.vy, 1.4);
            if (Math.random() < 0.3) {
                spawnParticles(player.onWall === 1 ? player.x + player.w : player.x, player.y + player.h/2, 1, "#ffffff", 0.5);
            }
        }
    }

    // Pulo & Buffer
    if (isJumpPressed()) {
        if (!player.jumpPressed) {
            player.jumpBuffer = 5;
            player.jumpPressed = true;
        }
    } else {
        player.jumpPressed = false;
        if (player.vy < -3 && !player.isDashing) player.vy *= 0.5;
    }

    if (player.jumpBuffer > 0) {
        if (player.coyoteTime > 0) {
            player.vy = player.jumpForce;
            player.grounded = false;
            player.coyoteTime = 0;
            player.jumpBuffer = 0;
            player.scaleX = 0.6; player.scaleY = 1.4;
            spawnParticles(player.x + player.w/2, player.y + player.h, 6, "#ffffff");
        } else if (player.onWall !== 0) {
            player.vy = player.jumpForce * 0.95;
            player.vx = -player.onWall * 6.5;
            player.onWall = 0;
            player.jumpBuffer = 0;
            player.scaleX = 0.7; player.scaleY = 1.3;
            spawnParticles(player.x + player.w/2, player.y + player.h/2, 8, "#ffffff");
        }
    }

    // Colisão Horizontal
    player.x += player.vx;
    player.onWall = 0;
    lvl.platforms.forEach(p => {
        if (checkCollision(player, p)) {
            if (player.vx > 0) { player.x = p.x - player.w; player.onWall = 1; }
            else if (player.vx < 0) { player.x = p.x + p.w; player.onWall = -1; }
            player.vx = 0;
        }
    });

    // Colisão Vertical
    const wasGrounded = player.grounded;
    player.y += player.vy;
    player.grounded = false;
    lvl.platforms.forEach(p => {
        if (checkCollision(player, p)) {
            if (player.vy > 0) {
                player.y = p.y - player.h;
                player.grounded = true;
                player.canDash = true;
                player.vy = 0;
                if (!wasGrounded) {
                    player.scaleX = 1.3; player.scaleY = 0.7;
                    spawnParticles(player.x + player.w/2, player.y + player.h, 5, "#ffffff");
                }
            } else if (player.vy < 0) {
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
    });

    // Espinhos e Limites
    if (player.y > WORLD_HEIGHT + 40) {
        if (debugMode) resetPlayer();
        else killPlayer();
    }
    lvl.spikes.forEach(s => {
        if (checkCollision(player, s)) killPlayer();
    });

    // Partículas de brilho de invencibilidade no Modo Debug
    if (debugMode && Math.random() < 0.25) {
        particles.push({
            x: player.x + Math.random() * player.w,
            y: player.y + Math.random() * player.h,
            vx: (Math.random() - 0.5) * 1.5,
            vy: -Math.random() * 1.5 - 0.5,
            size: 2,
            color: Math.random() > 0.5 ? "#ffe600" : "#05d9e8",
            life: 0.7,
            decay: 0.05
        });
    }

    // Morangos
    lvl.strawberries.forEach(s => {
        if (s.active && checkCollision(player, {x: s.x - 10, y: s.y - 10, w: 20, h: 20})) {
            s.active = false;
            strawberries++;
            player.canDash = true;
            spawnParticles(s.x, s.y, 14, "#ff3366", 1.4);
        }
    });

    // Próxima Fase
    if (checkCollision(player, lvl.exit)) {
        spawnParticles(player.x + player.w/2, player.y + player.h/2, 20, "#ffe600", 2);
        if (currentLevelIdx < levels.length - 1) {
            currentLevelIdx++;
            resetPlayer();
        } else {
            gameCompleted = true;
            if (finalTimeMs === null) {
                finalTimeMs = Date.now() - startTime;
            }
            saveStats();
        }
    }

    // Cabelo
    const headX = player.x + player.w/2 - player.facing * 3;
    const headY = player.y + 4;
    
    player.hair[0].x += (headX - player.hair[0].x) * 0.6;
    player.hair[0].y += (headY - player.hair[0].y) * 0.6;

    for (let i = 1; i < player.hair.length; i++) {
        const prev = player.hair[i - 1];
        const cur = player.hair[i];
        cur.x += (prev.x - cur.x) * 0.45;
        cur.y += (prev.y - cur.y) * 0.45 + 0.35;
    }

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(index, 1);
    });

    player.trail.forEach(t => t.alpha -= 0.09);
    player.trail = player.trail.filter(t => t.alpha > 0);
}

function checkCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function killPlayer() {
    if (debugMode) return; // Invencível no Modo Debug
    if (isRespawning) return;
    deaths++;
    isRespawning = true;
    respawnEndTime = Date.now() + RESPAWN_DELAY;
    spawnParticles(player.x + player.w/2, player.y + player.h/2, 25, "#ff2a6d", 2);
    player.vx = 0;
    player.vy = 0;
    player.isDashing = false;
}

function saveStats() {
    if (debugMode) return; // Não sobrescreve recordes legítimos em modo debug
    const elapsed = finalTimeMs !== null ? finalTimeMs : (Date.now() - startTime);
    const timeSpent = (elapsed / 1000).toFixed(2);
    if (!bestTime || parseFloat(timeSpent) < parseFloat(bestTime)) {
        bestTime = timeSpent;
        localStorage.setItem('peak_hike_best_time', bestTime);
    }
}

// --- DESENHO DA SETA BRANCA DE MIRA DE DASH ---
function drawAimArrow() {
    if (player.aimDir.x === 0 && player.aimDir.y === 0) return;

    const cx = player.x + player.w / 2 - cameraX;
    const cy = player.y + player.h / 2;
    const dist = 18;

    const angle = Math.atan2(player.aimDir.y, player.aimDir.x);
    const ax = cx + Math.cos(angle) * dist;
    const ay = cy + Math.sin(angle) * dist;

    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(angle);

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(-4, -5);
    ctx.lineTo(-1, 0);
    ctx.lineTo(-4, 5);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
}

// --- DESENHO DAS PLATAFORMAS ---
function drawTileablePlatform(p, lvl) {
    const tileSize = 10;
    const cols = Math.floor(p.w / tileSize);
    const rows = Math.floor(p.h / tileSize);

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const x = p.x + c * tileSize - cameraX;
            const y = p.y + r * tileSize;

            if (x + tileSize < 0 || x > canvas.width) continue;

            ctx.fillStyle = lvl.tileMain;
            ctx.fillRect(x, y, tileSize, tileSize);

            ctx.fillStyle = lvl.tileDetail;
            if ((r + c) % 2 === 0) {
                ctx.fillRect(x + 2, y + 2, 3, 3);
            }

            if (r === 0) {
                ctx.fillStyle = lvl.tileBorder;
                ctx.fillRect(x, y, tileSize, 2);
            }
        }
    }
}

function drawButton(btn, text, activeColor) {
    const hover = isHovered(btn);
    ctx.fillStyle = hover ? "#ffffff" : "#191228";
    ctx.fillRect(btn.x - 2, btn.y - 2, btn.w + 4, btn.h + 4);

    ctx.fillStyle = hover ? activeColor : "#141021";
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);

    ctx.fillStyle = hover ? "#000000" : activeColor;
    ctx.font = "9px 'Press Start 2P'";
    ctx.textAlign = "center";
    ctx.fillText(text, btn.x + btn.w / 2, btn.y + btn.h / 2 + 4);
}

function isHovered(btn) {
    return mouseX >= btn.x && mouseX <= btn.x + btn.w && mouseY >= btn.y && mouseY <= btn.y + btn.h;
}

function formatTime(ms) {
    const totalSecs = Math.floor(ms / 1000);
    const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
    const secs = (totalSecs % 60).toString().padStart(2, '0');
    const hundredths = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
    return `${mins}:${secs}.${hundredths}`;
}

// --- RENDERIZAÇÃO PRINCIPAL ---
function draw() {
    if (gameState === STATE_MENU) {
        drawMenu();
        mouseClicked = false;
        return;
    }

    if (gameState === STATE_CONFIG) {
        drawConfig();
        mouseClicked = false;
        return;
    }

    const lvl = levels[currentLevelIdx];

    // Fundo
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, lvl.bgSkyTop);
    grad.addColorStop(1, lvl.bgSkyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Efeito especial de céu estrelado para fases de espaço aberto / topo da montanha
    if (lvl.isSpaceTheme) {
        for (let i = 0; i < 75; i++) {
            const sx = ((i * 127 + 53) % WORLD_WIDTH) - cameraX * 0.25;
            const screenX = ((sx % canvas.width) + canvas.width) % canvas.width;
            const sy = (i * 71 + 17) % 360;
            const twinkle = Math.sin(Date.now() / 250 + i * 1.5) * 0.4 + 0.6;
            ctx.fillStyle = i % 4 === 0 ? `rgba(5, 217, 232, ${twinkle})` : (i % 3 === 0 ? `rgba(255, 230, 0, ${twinkle})` : `rgba(255, 255, 255, ${twinkle})`);
            const sz = (i % 7 === 0) ? 3 : (i % 3 === 0 ? 2 : 1);
            ctx.fillRect(Math.floor(screenX), Math.floor(sy), sz, sz);
        }
    }

    // Parallax
    ctx.fillStyle = lvl.mtnFar;
    ctx.beginPath();
    ctx.moveTo(0, 450);
    for(let i=0; i<=WORLD_WIDTH; i+=200) {
        ctx.lineTo(i - cameraX * 0.3, 180 + Math.sin(i) * 50);
    }
    ctx.lineTo(WORLD_WIDTH, 450);
    ctx.fill();

    ctx.fillStyle = lvl.mtnNear;
    ctx.beginPath();
    ctx.moveTo(0, 450);
    for(let i=0; i<=WORLD_WIDTH; i+=150) {
        ctx.lineTo(i - cameraX * 0.6, 260 + Math.cos(i) * 40);
    }
    ctx.lineTo(WORLD_WIDTH, 450);
    ctx.fill();

    // Partículas
    ambientParticles.forEach(p => {
        const px = p.x - cameraX;
        if (px >= 0 && px <= canvas.width) {
            ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
            ctx.fillRect(Math.floor(px), Math.floor(p.y), p.size, p.size);
        }
    });

    if (gameCompleted) {
        document.getElementById('timer-info').innerText = formatTime(finalTimeMs !== null ? finalTimeMs : (Date.now() - startTime));
        drawWinScreen();
        mouseClicked = false;
        return;
    }

    // Plataformas
    lvl.platforms.forEach(p => drawTileablePlatform(p, lvl));

    // Espinhos
    lvl.spikes.forEach(s => {
        const count = Math.floor(s.w / 10);
        for(let i = 0; i < count; i++) {
            const sx = s.x + (i * 10) - cameraX;
            if (sx + 10 < 0 || sx > canvas.width) continue;

            ctx.fillStyle = "#d63031";
            ctx.beginPath();
            ctx.moveTo(sx + 1, s.y + s.h);
            ctx.lineTo(sx + 5, s.y + 1);
            ctx.lineTo(sx + 9, s.y + s.h);
            ctx.fill();

            ctx.fillStyle = "#ff7675";
            ctx.fillRect(sx + 4, s.y + 3, 2, 3);
        }
    });

    // Morangos
    lvl.strawberries.forEach(s => {
        if (s.active) {
            const sx = s.x - cameraX;
            if (sx + 15 < 0 || sx > canvas.width) return;

            const floatY = s.y + Math.floor(Math.sin(Date.now() / 150) * 3);

            ctx.fillStyle = "rgba(255, 51, 102, 0.25)";
            ctx.fillRect(sx - 8, floatY - 8, 16, 16);

            ctx.fillStyle = "#ff0055";
            ctx.beginPath();
            ctx.arc(sx, floatY, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffe600";
            ctx.fillRect(sx - 2, floatY - 2, 1, 2);
            ctx.fillRect(sx + 2, floatY, 1, 2);

            ctx.fillStyle = "#00ff66";
            ctx.fillRect(sx - 4, floatY - 7, 8, 3);
        }
    });

    // Saída
    const ex = lvl.exit.x - cameraX;
    ctx.fillStyle = "#ffe600";
    ctx.fillRect(ex, lvl.exit.y, lvl.exit.w, lvl.exit.h);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(ex + 4, lvl.exit.y + 4, lvl.exit.w - 8, lvl.exit.h - 8);

    if (!isRespawning) {
        // Trail Dash
        player.trail.forEach(t => {
            ctx.fillStyle = `rgba(255, 42, 109, ${t.alpha})`;
            ctx.fillRect(Math.floor(t.x - cameraX), Math.floor(t.y), player.w, player.h);
        });

        // Personagem
        ctx.save();
        ctx.translate(Math.floor(player.x - cameraX + player.w / 2), Math.floor(player.y + player.h));
        ctx.scale(player.scaleX, player.scaleY);

        const px = -player.w / 2;
        const py = -player.h;
        const f = player.facing;

        // Rosto / Cabeça
        ctx.fillStyle = "#ffcca7";
        ctx.fillRect(px + (f === 1 ? 4 : 1), py + 3, 9, 6);

        // Olho
        ctx.fillStyle = "#000000";
        const eyeX = f === 1 ? px + 10 : px + 2;
        ctx.fillRect(eyeX, py + 4, 2, 3);

        // Jaqueta / Tronco
        ctx.fillStyle = "#1f4068";
        ctx.fillRect(px + 1, py + 8, 12, 6);

        // Zíper / Detalhe da jaqueta
        ctx.fillStyle = "#05d9e8";
        const zipX = f === 1 ? px + 7 : px + 6;
        ctx.fillRect(zipX, py + 8, 1, 6);

        // Cinto / Bainha da jaqueta
        ctx.fillStyle = "#121d2d";
        ctx.fillRect(px + 1, py + 14, 12, 1);

        // Pernas & Botas
        const legColorBack = "#253344";   // Perna traseira (sombra)
        const legColorFront = "#364a61";  // Perna dianteira
        const bootColor = "#5c3a21";      // Bota de couro marrom
        const soleColor = "#1a120c";      // Sola da bota

        if (!player.grounded) {
            // Pulo / No ar: pernas dobradas (tuck)
            ctx.fillStyle = legColorBack;
            ctx.fillRect(px + 2, py + 15, 4, 2);
            ctx.fillStyle = bootColor;
            ctx.fillRect(px + 2, py + 17, 4 + (f === 1 ? 1 : 0), 2);
            ctx.fillStyle = soleColor;
            ctx.fillRect(px + 2, py + 19, 4 + (f === 1 ? 1 : 0), 1);

            ctx.fillStyle = legColorFront;
            ctx.fillRect(px + 7, py + 15, 4, 2);
            const fxBoot = px + 7 + (f === 1 ? 1 : -1);
            ctx.fillStyle = bootColor;
            ctx.fillRect(fxBoot, py + 16, 4, 2);
            ctx.fillStyle = soleColor;
            ctx.fillRect(fxBoot, py + 18, 4, 1);
        } else if (Math.abs(player.vx) > 0.3) {
            // Correndo: passos com pernas alternadas
            const swing = Math.round(Math.sin(player.walkTimer) * 2.2);
            const bX = px + 2 - swing;
            const bLift = swing < 0 ? 1 : 0;
            ctx.fillStyle = legColorBack;
            ctx.fillRect(bX, py + 15, 4, 3 - bLift);
            ctx.fillStyle = bootColor;
            ctx.fillRect(bX + (f === 1 ? 1 : -1), py + 18 - bLift, 4, 2);
            ctx.fillStyle = soleColor;
            ctx.fillRect(bX + (f === 1 ? 1 : -1), py + 20 - bLift, 4, 1);

            const fX = px + 7 + swing;
            const fLift = swing > 0 ? 1 : 0;
            ctx.fillStyle = legColorFront;
            ctx.fillRect(fX, py + 15, 4, 3 - fLift);
            ctx.fillStyle = bootColor;
            ctx.fillRect(fX + (f === 1 ? 1 : -1), py + 18 - fLift, 4, 2);
            ctx.fillStyle = soleColor;
            ctx.fillRect(fX + (f === 1 ? 1 : -1), py + 20 - fLift, 4, 1);
        } else {
            // Parado (Idle): pernas e botas plantadas no chão
            ctx.fillStyle = legColorBack;
            ctx.fillRect(px + 2, py + 15, 4, 3);
            ctx.fillStyle = bootColor;
            ctx.fillRect(px + 1 + (f === 1 ? 0 : -1), py + 18, 5, 2);
            ctx.fillStyle = soleColor;
            ctx.fillRect(px + 1 + (f === 1 ? 0 : -1), py + 20, 5, 1);

            ctx.fillStyle = legColorFront;
            ctx.fillRect(px + 8, py + 15, 4, 3);
            ctx.fillStyle = bootColor;
            ctx.fillRect(px + 8 + (f === 1 ? 1 : 0), py + 18, 5, 2);
            ctx.fillStyle = soleColor;
            ctx.fillRect(px + 8 + (f === 1 ? 1 : 0), py + 20, 5, 1);
        }

        if (debugMode) {
            ctx.strokeStyle = "rgba(255, 230, 0, 0.75)";
            ctx.lineWidth = 1;
            ctx.strokeRect(px - 1, py - 1, player.w + 2, player.h + 2);
        }

        ctx.restore();

        // Cabelo
        const hairColor = player.canDash ? "#ff2a6d" : "#05d9e8";
        const hairShadow = player.canDash ? "#a60038" : "#007a87";

        for (let i = player.hair.length - 1; i >= 0; i--) {
            const h = player.hair[i];
            const r = Math.floor(6 - i * 0.9);

            ctx.fillStyle = hairShadow;
            ctx.beginPath();
            ctx.arc(Math.floor(h.x - cameraX), Math.floor(h.y + 1), r + 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = hairColor;
            ctx.beginPath();
            ctx.arc(Math.floor(h.x - cameraX), Math.floor(h.y), r, 0, Math.PI * 2);
            ctx.fill();
        }

        // Seta de Mira de Dash
        drawAimArrow();
    } else {
        // Mensagem retrô de contagem regressiva de respawn
        const remaining = Math.max(0, (respawnEndTime - Date.now()) / 1000).toFixed(1);
        ctx.save();
        ctx.fillStyle = "rgba(10, 5, 20, 0.85)";
        ctx.fillRect(canvas.width / 2 - 140, canvas.height / 2 - 22, 280, 44);
        ctx.strokeStyle = "#ff2a6d";
        ctx.lineWidth = 2;
        ctx.strokeRect(canvas.width / 2 - 140, canvas.height / 2 - 22, 280, 44);
        ctx.fillStyle = "#ffffff";
        ctx.font = "9px 'Press Start 2P'";
        ctx.textAlign = "center";
        ctx.fillText(`RENASCENDO EM ${remaining}s...`, canvas.width / 2, canvas.height / 2 + 4);
        ctx.restore();
    }

    // Partículas
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(Math.floor(p.x - cameraX), Math.floor(p.y), p.size, p.size);
        ctx.globalAlpha = 1.0;
    });

    // Atualização da Interface UI
    document.getElementById('level-info').innerText = `${lvl.name}`;
    document.getElementById('strawberries-info').innerText = `🍓 ${strawberries}`;
    document.getElementById('deaths-info').innerText = `MORTES: ${deaths}`;
    const elapsed = (gameCompleted && finalTimeMs !== null) ? finalTimeMs : (Date.now() - startTime);
    document.getElementById('timer-info').innerText = formatTime(elapsed);

    mouseClicked = false;
}

// --- GAME LOOP PRINCIPAL ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

updateFooterHint();
gameLoop();
</script>
